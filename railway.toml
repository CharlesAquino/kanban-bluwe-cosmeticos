[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments]
[environments.production]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "20"

[[services]]
name = "kanban-bluwe-cosmeticos"
source = { repo = "https://github.com/CharlesAquino/kanban-bluwe-cosmeticos" }
