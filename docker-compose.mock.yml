version: '3.8'

services:
  kanban-bluwe:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=8080
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    container_name: kanban-bluwe-mock
